<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังคำศัพท์ภาษามือไทย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home_page.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 22V11.5a2.5 2.5 0 0 1 5 0V19" stroke="#1F8A82" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M17 19v-3.2a2.3 2.3 0 0 1 4.6 0V19" stroke="#1F8A82" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M21.6 19v-2.6a2.2 2.2 0 0 1 4.4 0V19" stroke="#1F8A82" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M26 19v-1.6a2 2 0 0 1 4 0V23c0 5-3.6 9-9 9h-1.6c-3 0-4.9-1-6.7-3.1L8 22.7c-.9-1-.8-2.4.2-3.2.9-.7 2.2-.6 3 .2l2.8 2.7" stroke="#1F8A82" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">คลังคำศัพท์</span>
      </div>
      <a href="/model" class="btn-back">ทำนายผล</a>
    </div>
  </header>

  <main class="wrap">

    <section class="intro">
      <h1>คลังคำศัพท์ท่าทางภาษามือไทย</h1>
      <p class="intro-copy">รวบรวมคำศัพท์ภาษามือไทย 10 คำที่ใช้ในการทดสอบระบบ พร้อมวิดีโอตัวอย่างและคำอธิบายการทำท่าทางอย่างถูกต้อง</p>
    </section>

    <div class="controls">
      <div class="search-field">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M13.3 13.3 17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์ เช่น กิน, ป่วย, รัก" autocomplete="off">
      </div>
      <nav class="category-tabs" id="categoryTabs" aria-label="หมวดหมู่คำศัพท์">
        <button class="tab is-active" data-category="all">ทั้งหมด</button>
        <button class="tab" data-category="feeling">ความรู้สึก</button>
        <button class="tab" data-category="question">คำถาม</button>
        <button class="tab" data-category="action">การกระทำ</button>
      </nav>
    </div>

    <p class="result-count" id="resultCount"></p>

    <section class="grid" id="wordGrid" aria-live="polite">
      </section>

    <p class="empty-state" id="emptyState" hidden>ไม่พบคำที่ค้นหา ลองค้นหาด้วยคำอื่น</p>

  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalWord">
      <button class="modal-close" id="modalClose" aria-label="ปิด">
        <svg viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="modal-media" id="modalMedia"></div>
      <div class="modal-body">
        <span class="modal-category" id="modalCategory"></span>
        <h2 id="modalWord"></h2>
        <p id="modalNote"></p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <p>© 2026 มือสื่อสาร - ระบบจดจำภาษามือไทย</p>
    </div>
  </footer>

<script src="{{ url_for('static', filename='js/home_page.js') }}"></script>
</body>
</html>
